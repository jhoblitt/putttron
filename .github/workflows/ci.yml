name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to run on:" >&2
            echo "$out" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      # Full correctness, including the Monte Carlo integration tests.
      - run: go test -timeout 25m ./...
      # Race check. It has to skip the heavy Monte Carlo tests: the detector
      # instruments every read of the shared heightmap grid, and a trial makes
      # hundreds of thousands of them, which costs ~95x. The concurrency that
      # matters — the ParallelDo worker pool, the field cache, the server's job
      # state — is still exercised by the tests that survive -short.
      - run: go test -race -short -timeout 15m ./...
